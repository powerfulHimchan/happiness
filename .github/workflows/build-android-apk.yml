name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "game/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build ARM64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages required by Godot 4.7
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest"

      - name: Create ephemeral debug keystore
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "${RUNNER_TEMP}/happiness-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Happiness Tale,C=KR"

      - name: Export Godot project
        id: export
        uses: firebelley/godot-export@v8.0.0
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/happiness-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./game
          presets_to_export: Android Debug APK
          export_debug: true
          archive_output: false
          use_preset_export_path: true
          cache: true
          verbose: true

      - name: Collect and verify APK
        shell: bash
        run: |
          apk_path="$(find game/build -type f -name 'happiness-tale-cp202-damage.apk' -print -quit)"
          test -n "${apk_path}"
          test -s "${apk_path}"
          mkdir -p dist
          cp "${apk_path}" dist/happiness-tale-cp202-damage.apk
          sha256sum dist/happiness-tale-cp202-damage.apk \
            | tee dist/happiness-tale-cp202-damage.apk.sha256
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: happiness-tale-cp202-damage-apk
          path: |
            dist/happiness-tale-cp202-damage.apk
            dist/happiness-tale-cp202-damage.apk.sha256
          if-no-files-found: error
          retention-days: 14
