<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Happiness Tale 전투 화면 와이어프레임</title>
  <desc id="desc">가로형 모바일 화면의 왼쪽 하단에 이동 패드, 오른쪽 하단에 점프, 회피, 스킬 두 개, 필살기와 무기 전환 버튼을 배치한 전투 화면.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bdeeff"/>
      <stop offset="1" stop-color="#eefbdc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#183442" flood-opacity=".22"/>
    </filter>
    <style>
      text { font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #173142; }
      .label { font-size: 23px; font-weight: 700; }
      .small { font-size: 18px; font-weight: 600; }
      .hud { fill: #fff; fill-opacity: .9; }
      .button { fill: #fff; fill-opacity: .92; stroke: #3c6c81; stroke-width: 4; }
      .skill { fill: #d8f0ff; }
      .zone { fill: #fff; fill-opacity: .10; stroke: #fff; stroke-opacity: .82; stroke-width: 3; stroke-dasharray: 12 10; }
    </style>
  </defs>
  <rect width="1600" height="900" rx="32" fill="url(#sky)"/>
  <circle cx="230" cy="160" r="72" fill="#fff1a8"/>
  <path d="M0 565 Q330 325 740 585 V900 H0Z" fill="#8ed19a"/>
  <path d="M700 585 Q1140 310 1600 540 V900 H700Z" fill="#73bc87"/>
  <rect y="690" width="1600" height="210" fill="#5f9b67"/>
  <rect y="680" width="1600" height="18" fill="#a1e580"/>
  <rect x="710" y="505" width="290" height="32" rx="12" fill="#6d9f61" stroke="#a7e489" stroke-width="8"/>

  <g filter="url(#shadow)">
    <rect class="hud" x="48" y="40" width="455" height="112" rx="22"/>
    <text class="label" x="72" y="78">로안 · HP 72 / 100</text>
    <rect x="72" y="92" width="405" height="14" rx="7" fill="#d9e3e8"/>
    <rect x="72" y="92" width="292" height="14" rx="7" fill="#ef6a71"/>
    <rect x="72" y="118" width="405" height="10" rx="5" fill="#d9e3e8"/>
    <rect x="72" y="118" width="174" height="10" rx="5" fill="#4c9de8"/>

    <rect class="hud" x="684" y="40" width="232" height="92" rx="22"/>
    <text class="label" x="800" y="79" text-anchor="middle">02:18</text>
    <text class="small" x="800" y="109" text-anchor="middle">1 / 3 웨이브</text>

    <rect class="hud" x="1160" y="40" width="392" height="100" rx="22"/>
    <text class="label" x="1524" y="80" text-anchor="end">검 ↔ 활</text>
    <text class="small" x="1524" y="112" text-anchor="end">필살기 64%</text>
  </g>

  <g>
    <rect x="615" y="525" width="88" height="155" rx="38" fill="#ffe58a" stroke="#2e6780" stroke-width="7"/>
    <text class="small" x="659" y="610" text-anchor="middle">로안</text>
    <rect x="1052" y="598" width="118" height="82" rx="38" fill="#ef8e9b" stroke="#8f4052" stroke-width="7"/>
    <text class="small" x="1111" y="647" text-anchor="middle">적</text>
    <ellipse cx="1111" cy="638" rx="92" ry="78" fill="none" stroke="#fff" stroke-width="7"/>
    <ellipse cx="1111" cy="638" rx="101" ry="87" fill="none" stroke="#e94b5f" stroke-width="4"/>
    <rect x="1007" y="728" width="208" height="44" rx="10" fill="#a83748"/>
    <text class="small" x="1111" y="757" text-anchor="middle" fill="#fff">자동 공격 대상</text>
  </g>

  <rect class="zone" x="32" y="500" width="500" height="360" rx="28"/>
  <text class="small" x="58" y="536" fill="#fff">이동 터치 영역</text>
  <rect class="zone" x="1000" y="500" width="568" height="360" rx="28"/>
  <text class="small" x="1026" y="536" fill="#fff">전투 터치 영역</text>

  <g filter="url(#shadow)">
    <circle cx="204" cy="710" r="105" fill="#fff" fill-opacity=".23" stroke="#fff" stroke-opacity=".85" stroke-width="4"/>
    <circle cx="204" cy="710" r="50" fill="#fff" fill-opacity=".65"/>

    <circle class="button" cx="1468" cy="758" r="76" fill="#fff4bd"/>
    <text class="label" x="1468" y="767" text-anchor="middle">점프</text>

    <circle class="button" cx="1308" cy="770" r="62"/>
    <text class="small" x="1308" y="778" text-anchor="middle">회피</text>

    <circle class="button skill" cx="1270" cy="606" r="62"/>
    <text class="small" x="1270" y="600" text-anchor="middle">스킬</text>
    <text class="small" x="1270" y="628" text-anchor="middle">1</text>

    <circle class="button skill" cx="1438" cy="573" r="62"/>
    <text class="small" x="1438" y="567" text-anchor="middle">스킬</text>
    <text class="small" x="1438" y="595" text-anchor="middle">2</text>

    <circle class="button" cx="1107" cy="620" r="62" fill="#ffe1a3" stroke="#c6841d"/>
    <text class="small" x="1107" y="628" text-anchor="middle">필살기</text>

    <rect class="button" x="1054" y="728" width="106" height="96" rx="20" fill="#e8defc"/>
    <text class="small" x="1107" y="784" text-anchor="middle">전환</text>
  </g>

  <rect x="30" y="25" width="1540" height="850" rx="24" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="2" stroke-dasharray="6 8"/>
  <text class="small" x="50" y="852" fill="#fff">2% 안전 영역</text>
</svg>
